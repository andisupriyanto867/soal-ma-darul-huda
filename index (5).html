<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ujian Online – MA Darul Huda Pusat</title>
<meta name="theme-color" content="#2e5088">
<link rel="manifest" href="manifest.json">
<style>
:root{--bg:#eaf0f8;--card:#fff;--ink:#1f2d3d;--muted:#6b7a90;--line:#dfe6ef;--pri:#1f78d1;--pri-d:#1762ae;--pri-l:#e8f2fc;--nav:#2e5088;--nav-d:#223f6e;--nav-dd:#1a3358;--pill:#1d3b6f;--ok:#1a9c55;--ok-l:#eaf7f0;--bad:#d64545;--bad-l:#fdeeee;--warn:#c98a00;--warn-l:#fff6dc;--r:6px;--sh:0 1px 2px rgba(20,40,80,.07)}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;font-size:14px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0;line-height:1.25}
.muted{color:var(--muted)}.sm{font-size:12px}
.ic{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-3px;flex:none}
/* header */
.top{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--line);min-height:54px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:6px 12px;padding:4px clamp(12px,2vw,22px)}
.brand{display:flex;align-items:center;gap:10px;cursor:pointer;min-width:0}
.brand>div{min-width:0}
.logo{width:34px;height:34px;border-radius:8px;background:linear-gradient(135deg,var(--nav),var(--pri));color:#fff;display:grid;place-items:center;font-weight:800;font-size:16px;flex:none}
.brand b{display:block;font-size:15px}
.brand small{display:block;color:var(--muted);font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tr{display:flex;align-items:center;gap:10px}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:4px 10px;border-radius:99px;background:var(--ok-l);color:var(--ok);white-space:nowrap}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.pill.off{background:var(--warn-l);color:var(--warn)}
.top{transition:background .3s}
.logo{position:relative;overflow:hidden}
.logo img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#fff;border-radius:8px;padding:2px}
.top .btn{background:#fff;color:#1d3b6f;border:2px solid #fff;font-weight:700;box-shadow:0 1px 5px rgba(0,0,0,.3)}
.top .btn:hover{background:#eaf0f8;border-color:#eaf0f8}
.clock{text-align:center;line-height:1.2;color:#fff;font-variant-numeric:tabular-nums;white-space:nowrap}
.clock b{display:block;font-size:17px;letter-spacing:.5px}
.clock span{display:block;font-size:11px;opacity:.92}
.clock .cs{display:none}
@media(max-width:640px){.clock .cl{display:none}.clock .cs{display:block}.clock b{font-size:14px}.brand b{font-size:14px}}
.top.on{background:#1a9c55;border-bottom-color:#14803f;color:#fff}
.top.off{background:#d64545;border-bottom-color:#b83232;color:#fff}
.top.on .brand small,.top.off .brand small{color:rgba(255,255,255,.85)}
.top.on .pill,.top.off .pill{background:rgba(255,255,255,.22);color:#fff}
.top.inexam .brand small{display:block;max-width:52vw;font-weight:600;color:#fff}
/* buttons */
.btn{border:1px solid var(--line);background:#fff;border-radius:5px;padding:8px 15px;font-weight:600;cursor:pointer;transition:.15s;display:inline-flex;align-items:center;justify-content:center;gap:6px;font-size:13.5px}
.btn:hover{background:#f6f9fd;border-color:#c5d3e6}
.btn.pri{background:var(--pri);border-color:var(--pri);color:#fff}.btn.pri:hover{background:var(--pri-d)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.bad{color:var(--bad);border-color:#f3c4c4}.btn.bad:hover{background:var(--bad-l)}
.btn.sm{padding:6px 11px;font-size:12.5px}
.btn.ghost{background:transparent}
.btn.fl{background:var(--warn-l);border-color:#ecc96a;color:var(--warn)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.ib{border:1px solid var(--line);background:#fff;border-radius:5px;width:30px;height:30px;display:inline-grid;place-items:center;cursor:pointer;color:#47607f}
.ib:hover{background:var(--pri-l);border-color:#9ec5ee;color:var(--pri)}
.ib.bad{color:var(--bad)}.ib.bad:hover{background:var(--bad-l);border-color:#f3c4c4}
.wrap{max-width:1180px;margin:0 auto;padding:18px clamp(12px,2vw,22px) 60px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row.end{justify-content:flex-end}.row.between{justify-content:space-between}
.sp{flex:1}
/* shell */
.shell{display:grid;grid-template-columns:224px 1fr;min-height:calc(100vh - 54px)}
.side{background:linear-gradient(180deg,var(--nav),var(--nav-d));color:#dbe6f6;padding:10px 0;display:flex;flex-direction:column;position:sticky;top:54px;height:calc(100vh - 54px);align-self:start}
.side .it{display:flex;align-items:center;gap:11px;padding:12px 18px;font-size:13.5px;border:0;border-left:3px solid transparent;background:transparent;color:inherit;width:100%;text-align:left;cursor:pointer}
.side .it:hover{background:rgba(255,255,255,.08)}
.side .it.on{background:var(--nav-dd);color:#fff;border-left-color:#5aa9ff;font-weight:600}
.main{padding:16px clamp(12px,2vw,22px) 50px;min-width:0}
/* pills / tabs / panel */
.pills{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.pl{border:1px solid var(--line);background:#fff;border-radius:99px;padding:7px 15px;font-size:13px;font-weight:600;color:#33455e;cursor:pointer;display:inline-flex;align-items:center;gap:7px}
.pl:hover{border-color:#9ec5ee}
.pl.on{background:var(--pill);color:#fff;border-color:var(--pill)}
.pl b{background:var(--pri);color:#fff;font-size:11px;border-radius:99px;padding:1px 7px;font-weight:700}
.panel{background:#fff;border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);margin-bottom:18px}
.ph{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 14px;border-bottom:1px solid var(--line)}
.ph h3{font-size:15px}
.stabs{display:flex;flex-wrap:wrap;padding:10px 12px 0;border-bottom:1px solid #9ec5ee}
.st{border:1px solid #9ec5ee;border-bottom:0;background:#fff;color:var(--pri);padding:6px 15px;font-size:13px;cursor:pointer;margin-right:4px;border-radius:4px 4px 0 0}
.st.on{background:var(--pri);border-color:var(--pri);color:#fff}
.tbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:10px 12px}
.srch{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:5px;padding:0 10px;background:#fff;min-width:200px}
.srch input{border:0;outline:0;padding:7px 0;width:100%;background:transparent}
.srch:focus-within{border-color:var(--pri)}
.tw{overflow:auto}
.tbl{width:100%;border-collapse:collapse;font-size:13px;background:#fff}
.tbl th{background:#f5f8fc;text-align:left;padding:9px 12px;font-size:12px;color:#51647d;font-weight:700;white-space:nowrap;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.tbl td{padding:9px 12px;border-bottom:1px solid #edf1f6;vertical-align:middle}
.tbl tbody tr:hover{background:#f3f8fe}
.tbl tr.sel{background:#dcebfb}
.tbl .no{color:var(--muted);width:44px}
.tbl .ck{width:38px;text-align:center}
.tbl .ac{white-space:nowrap;text-align:right}
.cb{width:16px;height:16px;accent-color:var(--pri);cursor:pointer}
.lnk{color:var(--pri);font-weight:600}
.pager{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 14px;font-size:12.5px}
.pgs{display:flex;gap:4px;align-items:center;flex-wrap:wrap}
.pgb,.pgl{border:0;background:transparent;color:#51647d;padding:4px 9px;border-radius:4px;cursor:pointer;font-size:12.5px}
.pgb:hover,.pgl:hover{background:var(--pri-l)}
.pgb.on{background:var(--pri);color:#fff;font-weight:700}
.pgl:disabled{opacity:.4;cursor:not-allowed;background:transparent}
.chip{display:inline-block;background:var(--pri-l);color:var(--pri-d);font-size:12px;font-weight:600;padding:3px 10px;border-radius:99px;white-space:nowrap}
.chip.g{background:#eef2f7;color:#51647d}.chip.w{background:var(--warn-l);color:var(--warn)}.chip.ok{background:var(--ok-l);color:var(--ok)}.chip.bd{background:var(--bad-l);color:var(--bad)}
.empty{text-align:center;padding:44px 20px;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:12px}
.stat{background:#fff;border:1px solid var(--line);border-left:3px solid var(--pri);border-radius:var(--r);padding:10px 14px}
.stat small{color:var(--muted);display:block}.stat b{font-size:22px}
/* forms */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:18px}
.form{max-width:480px;margin:26px auto}
.fld{display:block;margin-bottom:14px}
.fld span{display:block;font-size:13px;font-weight:600;margin-bottom:6px;color:#33455e}
.inp{width:100%;border:1px solid #c9d6e6;border-radius:5px;padding:9px 11px;background:#fff;outline:none;transition:.15s}
.inp:focus{border-color:var(--pri);box-shadow:0 0 0 3px rgba(31,120,209,.15)}
.inp[readonly]{background:#f3f6fa;color:var(--muted)}
textarea.inp{resize:vertical;min-height:80px}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.sw{display:inline-flex;align-items:center;gap:8px;cursor:pointer;font-size:13px;font-weight:600;color:#475569}
.sw input{width:38px;height:22px;appearance:none;-webkit-appearance:none;background:#c5d0de;border-radius:99px;position:relative;cursor:pointer;transition:.2s;margin:0}
.sw input::after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;background:#fff;border-radius:50%;transition:.2s}
.sw input:checked{background:var(--ok)}.sw input:checked::after{left:18px}
/* beranda siswa */
.hero{display:flex;align-items:center;gap:16px;background:#fff;border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:16px 18px;margin-bottom:14px}
.hero h1{font-size:21px;color:var(--nav)}
.hero p{margin:4px 0 0;color:var(--muted)}
.logo.big{width:76px;height:76px;border-radius:16px;font-size:32px}
.logo.big img{border-radius:16px;padding:4px}
/* halaman mulai */
.sumgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin-bottom:14px}
.sumgrid div{background:#f5f8fc;border:1px solid var(--line);border-radius:6px;padding:8px 12px}
.sumgrid small{display:block;color:var(--muted);font-size:11.5px}
.sumgrid b{font-size:13.5px}
.rules{background:var(--warn-l);border:1px solid #f1dc9c;border-radius:6px;padding:12px 14px 6px;margin-bottom:16px}
.rules b{display:block;margin-bottom:6px;color:#7a5600}
.rules ol{margin:0 0 6px;padding-left:20px}
.rules li{margin-bottom:4px;font-size:13px}
.chk{display:flex;gap:10px;align-items:flex-start;font-size:13px;font-weight:600;margin:4px 0 16px;cursor:pointer;color:#33455e}
.chk input{margin-top:2px;flex:none}
/* exam */
.exh{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.exh h2{font-size:19px}
.timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:18px;background:#fff;border:1px solid var(--line);border-radius:6px;padding:6px 14px;color:var(--pri-d);white-space:nowrap}
.timer.low{color:var(--bad);border-color:#f3c4c4;background:var(--bad-l)}
.exbar{position:sticky;top:var(--hh,54px);z-index:15;display:flex;align-items:center;gap:14px;background:#fff;border:1px solid var(--line);border-radius:8px;box-shadow:0 2px 8px rgba(20,40,80,.08);padding:8px 14px;margin-bottom:12px}
.exbar .prog{flex:1;margin:0}
.exbar .cnt{white-space:nowrap;font-size:13px}
.exgrid{max-width:820px;margin:0 auto}
.exh,.exbar{max-width:820px;margin-left:auto;margin-right:auto}
.exside{position:sticky;top:calc(var(--hh,54px) + 70px);padding:14px}
.exside>summary{cursor:pointer;font-weight:700;list-style:none}
.exside>summary::-webkit-details-marker{display:none}
.exside>summary::after{content:"▾";float:right;color:var(--muted)}
.exside:not([open])>summary::after{content:"▸"}
.navscroll{max-height:52vh;overflow:auto;padding:3px}
.qcard{scroll-margin-top:calc(var(--hh,54px) + 76px)}
.pgin{animation:pgin .28s ease both}
@keyframes pgin{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.qno{font-size:13px;font-weight:700;color:var(--pri)}
.qtext{font-size:18px;line-height:1.6;margin:8px 0 18px;white-space:pre-wrap}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:8px;padding:11px 14px;margin-bottom:10px;cursor:pointer;transition:.15s}
.opt:hover{border-color:#93c5fd;background:#f8fbff}
.opt .lt{flex:none;width:30px;height:30px;border-radius:50%;background:#eef2f7;display:grid;place-items:center;font-weight:700;font-size:13px;position:relative}
.opt.sel{border-color:var(--pri);background:var(--pri-l)}.opt.sel .lt{background:var(--pri);color:#fff}
.opt.sel .lt::after{content:"✓";position:absolute;top:-7px;right:-7px;width:17px;height:17px;border-radius:50%;background:var(--ok);color:#fff;font-size:11px;font-weight:800;line-height:1;display:grid;place-items:center;border:2px solid #fff}
.opt.good{border-color:var(--ok);background:var(--ok-l)}.opt.good .lt{background:var(--ok);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--bad-l)}.opt.wrong .lt{background:var(--bad);color:#fff}
.opt span.tx{padding-top:3px;white-space:pre-wrap}
.nav{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:12px 0 16px}
.nv{aspect-ratio:1;border:1.5px solid var(--line);background:#fff;border-radius:7px;font-weight:600;cursor:pointer;position:relative}
.nv:hover{border-color:#93c5fd}
.nv.ans{background:var(--pri-l);border-color:#93c5fd;color:var(--pri-d)}
.nv.cur{background:var(--pri);border-color:var(--pri);color:#fff}
.nv.pg{box-shadow:0 0 0 2px var(--pri)}
.nv.flag::after{content:"";position:absolute;top:3px;right:3px;width:8px;height:8px;border-radius:50%;background:#e0a100}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:4px;vertical-align:-1px;border:1.5px solid var(--line)}
.prog{height:8px;border-radius:99px;background:#e2e8f0;overflow:hidden;margin:10px 0}
.prog b{display:block;height:100%;background:linear-gradient(90deg,#3b82f6,var(--pri));border-radius:99px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.cn{min-width:40px;height:34px;border:1.5px solid #f3c4c4;background:var(--bad-l);color:var(--bad);border-radius:6px;font-weight:700;cursor:pointer}
.cn.w{border-color:#ecc96a;background:var(--warn-l);color:var(--warn)}
.res{max-width:760px;margin:0 auto}
.ring{width:150px;height:150px;border-radius:50%;display:grid;place-items:center;margin:6px auto 14px}
.ring div{width:118px;height:118px;border-radius:50%;background:#fff;display:grid;place-items:center;text-align:center}
.ring b{font-size:32px;display:block;line-height:1}.ring small{color:var(--muted)}
.banner{padding:12px 16px;border-radius:6px;font-size:14px;margin:14px 0;font-weight:500}
.banner.ok{background:var(--ok-l);color:#166534}.banner.w{background:var(--warn-l);color:#92400e}
.rv{border-top:1px solid var(--line);padding:16px 0}
/* editor */
.edwrap{max-width:920px}
.qc{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:12px;box-shadow:var(--sh)}
.qh{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.orow{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.orow .lt{flex:none;width:30px;height:30px;border-radius:50%;background:#eef2f7;display:grid;place-items:center;font-weight:700;font-size:13px}
.orow input[type=radio]{width:18px;height:18px;accent-color:var(--ok);flex:none}
.orow label.k{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:4px;flex:none;cursor:pointer}
.keyb{display:inline-block;background:var(--ok-l);color:#166534;font-weight:700;border-radius:6px;padding:3px 10px;font-size:13px}
.keyb.none{background:var(--bad-l);color:var(--bad)}
.keygrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(74px,1fr));gap:8px;margin:12px 0}
.keygrid div{border:1px solid var(--line);border-radius:6px;padding:6px;text-align:center;font-size:13px}
.keygrid b{display:block;font-size:17px;color:var(--ok)}
.dot{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:7px;vertical-align:-1px}
.dot.g{background:var(--ok);box-shadow:0 0 0 3px var(--ok-l)}
.dot.r{background:var(--bad);box-shadow:0 0 0 3px var(--bad-l)}
.top.inexam,.top.inexam.on,.top.inexam.off{background:var(--nav);border-bottom-color:var(--nav-dd);color:#fff}
/* modal & toast */
.ov{position:fixed;inset:0;background:rgba(15,30,60,.45);display:grid;place-items:center;z-index:50;padding:16px}
.mbox{background:#fff;border-radius:10px;padding:22px;width:100%;max-width:480px;max-height:88vh;overflow:auto;box-shadow:0 20px 60px rgba(15,23,42,.25)}
.mbox h3{margin-bottom:8px;font-size:17px}.mbox p{margin:0 0 14px;color:var(--muted)}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:60;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.tt{background:#1e293b;color:#fff;padding:10px 18px;border-radius:99px;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.2);animation:up .25s}
@keyframes up{from{opacity:0;transform:translateY(10px)}}
@media(max-width:900px){.exgrid{grid-template-columns:1fr}.nav{grid-template-columns:repeat(8,1fr)}.brand small{display:none}.exside{position:static;order:-1}.navscroll{max-height:none}}
@media(max-width:860px){.shell{grid-template-columns:1fr}.side{position:static;height:auto;flex-direction:row;overflow:auto;padding:0}.side .it{width:auto;white-space:nowrap;border-left:0;border-bottom:3px solid transparent;padding:12px 14px}.side .it.on{border-bottom-color:#5aa9ff}.side .sp{display:none}}
@media(max-width:640px){.hm{display:none}.nav{grid-template-columns:repeat(6,1fr)}.qtext{font-size:16px}.btn{padding:8px 12px}.srch{min-width:0;flex:1}.hero{padding:12px}.hero h1{font-size:17px}.logo.big{width:60px;height:60px;font-size:26px}.exbar{gap:8px;padding:6px 10px}.exbar .cnt{font-size:12px}.timer{font-size:15px;padding:5px 10px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

<script>
const LOGO = "https://i.supaimg.com/2c2fe634-0778-4567-93bf-17d826ecd3d2/b40b2e28-4555-40d1-bafa-b59649711d39.jpg";
const BRAND_SUB = 'MA Darul Huda Pusat Mandalawangi';
const firebaseConfig = {
  apiKey: "AIzaSyBY5gcQkoLb0wp8I1NLHBdy6OAGHPUvDDU",
  authDomain: "ma-darul-huda-pusat.firebaseapp.com",
  databaseURL: "https://ma-darul-huda-pusat-default-rtdb.firebaseio.com",

function remaining() { const a = S.att, d = a.exam.duration; if (!d) return Infinity; let r = d * 60 - (now() - a.startedAt) / 1000; if (a.exam.startAt) r = Math.min(r, (a.exam.startAt + d * 60000 - now()) / 1000); return r; }
function fmt(t) { if (t === Infinity) return 'Tanpa batas'; t = Math.max(0, Math.floor(t)); const h = Math.floor(t / 3600), m = Math.floor(t % 3600 / 60), s = t % 60; return (h ? h + ':' : '') + String(m).padStart(h ? 2 : 1, '0') + ':' + String(s).padStart(2, '0'); }

const PQ = 10;
function vExam() {
  const a = S.att, qs = a.exam.qs, total = qs.length, pages = Math.ceil(total / PQ), pg = Math.min(Math.floor((a.cur || 0) / PQ), pages - 1), from = pg * PQ, list = qs.slice(from, from + PQ);
  const done = qs.filter(x => a.answers[x.id] !== undefined).length, t = remaining(), last = pg === pages - 1;
  const anim = S.anim; S.anim = false;
  return `<div class="wrap"><div class="exh"><div><h2>${esc(a.exam.title)}</h2><span class="muted">${esc(a.name)} • ${esc((a.tipe === 'masuk' ? a.asalSekolah : a.kelas) || '-')}</span></div></div>
  <div class="exbar"><span class="cnt"><b>${done}/${total}</b> <span class="muted">terjawab</span></span><div class="prog"><b style="width:${total ? done / total * 100 : 0}%"></b></div>${t === Infinity ? '' : `<span id="timer" class="timer ${t < 300 ? 'low' : ''}">${fmt(t)}</span>`}</div>
  <div class="exgrid"><div class="${anim ? 'pgin' : ''}">
    ${list.map((q, k) => { const n = from + k, an = a.answers[q.id] !== undefined; return `<div class="card qcard" id="q${n}" style="margin-bottom:12px">
      <div class="qno">Soal ${n + 1} dari ${total}</div>
      <div class="qtext">${esc(q.text)}</div>
      ${q.opts.map((o, i) => `<button class="opt ${a.answers[q.id] === i ? 'sel' : ''}" data-act="ans" data-q="${n}" data-i="${i}"><span class="lt">${LT[i]}</span><span class="tx">${esc(o)}</span></button>`).join('')}
      <div class="row" style="margin-top:6px">${an ? `<button class="btn sm ghost" data-act="clr" data-q="${n}">Hapus jawaban</button>` : ''}</div></div>`; }).join('')}
    <div class="card"><div class="row between"><button class="btn" data-act="prev" ${pg === 0 ? 'disabled' : ''}>← Halaman Sebelumnya</button><span class="muted">Halaman ${pg + 1} dari ${pages}</span>
      ${last ? '<button class="btn ok" data-act="finish">Selesai & Kirim</button>' : '<button class="btn pri" data-act="next">Halaman Berikutnya →</button>'}</div>
      <div class="row between" style="margin-top:12px"><span class="muted sm">Soal boleh dilewati dan dikerjakan kembali sebelum dikirim. Jawaban tersimpan otomatis.</span><button class="btn sm ghost" data-act="home">Keluar sementara</button></div></div>
  </div>
  </div></div>`;
}

function vResult() {

/* ---------- impor soal ---------- */
function parseQs(text) {
  const out = []; let q = null, bad = 0;
  const push = () => { if (q && q.text.trim()) out.push(q); q = null; };
  text.split(/\r?\n/).forEach(raw => {
    const ln = raw.trim(); if (!ln) return;
    const f = ln.split(/[;\t]/).map(x => x.trim().replace(/^"|"$/g, ''));
    if (f.length >= 4 && /^[A-Ea-e]$/.test(f[f.length - 1])) {
      push(); const o = f.slice(1, -1).slice(0, 5), a = LT.indexOf(f[f.length - 1].toUpperCase());
      out.push({text: f[0], opts: o, ans: a < o.length ? a : -1}); return;
    }
    if (f.length > 1 && /^(pertanyaan|soal)$/i.test(f[0])) return;
    let m;
    if ((m = ln.match(/^(?:kunci|jawaban|key|answer)(?:\s+jawaban)?\s*[:=\-]?\s*([A-Ea-e])\b/i))) { if (q) q.ans = LT.indexOf(m[1].toUpperCase()); return; }
    if (q && (m = ln.match(/^([A-Ea-e])[.)]\s*(.*)$/))) { q.opts.push(m[2]); return; }
    if ((m = ln.match(/^\d+[.)]\s*(.*)$/))) { push(); q = {text: m[1], opts: [], ans: -1}; return; }
    if (!q || q.ans >= 0) { push(); q = {text: ln, opts: [], ans: -1}; }
    else if (q.opts.length) q.opts[q.opts.length - 1] += ' ' + ln;
    else q.text += '\n' + ln;
  });
  push();
  const ok = out.filter(x => x.opts.length >= 2 && x.opts.length <= 5);
  ok.forEach(x => { if (x.ans >= x.opts.length) x.ans = -1; });
  return {qs: ok, skipped: out.length - ok.length};
}

    S.att = old || {examId: S.pick, ...id, tipe: tipeOf(e), startedAt: now(), answers: {}, flags: {}, cur: 0, exam: ex};
    saveAtt(); S.view = 'exam'; S.anim = false; render(); liveStart();
  },
  ans(t) { const a = S.att, q = a.exam.qs[+t.dataset.q]; a.answers[q.id] = +t.dataset.i; saveAtt(); render(true); liveSend(); },
  clr(t) { const a = S.att, q = a.exam.qs[+t.dataset.q]; delete a.answers[q.id]; saveAtt(); render(true); liveSend(); },
  go(t) {
    const a = S.att, i = +t.dataset.i; closeModal();
    S.anim = Math.floor(i / PQ) !== Math.floor((a.cur || 0) / PQ);
    a.cur = i; saveAtt(); render();
    setTimeout(() => { const el = document.getElementById('q' + i); if (el) el.scrollIntoView({block: 'start'}); }, 20);
  },
  next() { const a = S.att, pg = Math.floor((a.cur || 0) / PQ); S.anim = true; a.cur = (pg + 1) * PQ; saveAtt(); render(); },
  prev() { const a = S.att; S.anim = true; a.cur = Math.max(0, Math.floor((a.cur || 0) / PQ) - 1) * PQ; saveAtt(); render(); },
  finish() { finish(false); },
  sendnow() { closeModal(); finish(true); },
  /* admin */
  adminbtn() {
    if (S.admin) { S.admin = false; sessionStorage.removeItem('adm'); S.edit = null; S.view = 'home'; return render(); }
    if (!ADMIN_LOCK) { S.admin = true; sessionStorage.setItem('adm', '1'); S.view = 'admin'; S.tab = 'exams'; listenSubs(); return render(); }
    const has = !!S.cfg.adminHash;
    openModal(`<h3>${has ? 'Masuk Admin' : 'Buat Password Admin'}</h3><p>${has ? 'Masukkan password admin untuk mengelola soal.' : 'Belum ada password admin. Buat password sekarang (butuh koneksi internet).'}</p>
    <input type="password" id="ap" class="inp" placeholder="Password" style="margin-bottom:10px">${has ? '' : '<input type="password" id="ap2" class="inp" placeholder="Ulangi password" style="margin-bottom:10px">'}
    <div class="row end"><button class="btn" data-act="closem">Batal</button><button class="btn pri" data-act="adminok">${has ? 'Masuk' : 'Simpan & Masuk'}</button></div>`);
    setTimeout(() => $('#ap') && $('#ap').focus(), 50);
  },
  async adminok() {
    const p = $('#ap').value; if (!p) return toast('Password wajib diisi');
    const h = await sha(p);
    if (S.cfg.adminHash) { if (h !== S.cfg.adminHash) return toast('Password salah'); }
    else {
      if (p.length < 4) return toast('Password minimal 4 karakter');
      if (p !== $('#ap2').value) return toast('Ulangi password tidak sama');
      if (!db || !S.online) return toast('Perlu internet untuk membuat password pertama kali');
      await db.ref('config/adminHash').set(h); S.cfg.adminHash = h;
    }
    S.admin = true; sessionStorage.setItem('adm', '1'); S.view = 'admin'; S.tab = 'exams'; closeModal(); listenSubs(); render();
  },
  async tab(t) {
    if (S.edit) {
      const ok = await ask('Tinggalkan editor?', 'Perubahan yang belum disimpan akan hilang.', 'Tinggalkan', true);
      closeModal(); if (!ok) return; S.edit = null;
    }
    S.tab = t.dataset.t; S.view = 'admin'; render();
  },
  ptipe(t) { S.tipe = t.dataset.v; S.filter = ''; S.pg.exams = S.pg.results = 1; render(true); },
  pest(t) { S.est = t.dataset.v; S.pg.exams = 1; render(true); },
  pkls(t) { S.kls = t.dataset.v; S.pg.students = 1; render(true); },
  pg(t) { S.pg[t.dataset.k] = +t.dataset.p; render(true); },
  newexam() { S.edit = newEdit(); render(); },
  editexam(t) { S.edit = loadEdit(t.dataset.id); render(); },
  canceledit() { S.edit = null; render(); },
  impq() {
    openModal(`<h3>Impor Soal</h3><p>Tempel soal dari Word/teks, atau pilih berkas .txt / .csv. Format: nomor + pertanyaan, pilihan A–E, lalu baris <b>Kunci: B</b>. Atau satu soal per baris: <b>Pertanyaan;A;B;C;D;Kunci</b>.</p>
    <textarea id="impq_txt" class="inp" style="min-height:190px" placeholder="1. Ibu kota Indonesia adalah…&#10;A. Bandung&#10;B. Jakarta&#10;C. Surabaya&#10;Kunci: B&#10;&#10;2. 2 + 3 = …&#10;A. 4&#10;B. 5&#10;Kunci: B"></textarea>
    <label class="fld" style="margin-top:10px"><span>Atau pilih berkas</span><input type="file" id="impq_file" accept=".csv,.txt,text/csv,text/plain" class="inp"></label>
    <div class="row end"><button class="btn" data-act="closem">Batal</button><button class="btn pri" data-act="doimpq">Impor</button></div>`);
  },
  doimpq() {
    const r = parseQs($('#impq_txt').value);
    if (!r.qs.length) return toast('Tidak ada soal terbaca. Periksa format (minimal 2 pilihan per soal).');
    const E = S.edit, blank = E.qs.length === 1 && !E.qs[0].text.trim() && E.qs[0].opts.every(o => !o.trim());
    const add = r.qs.map(x => ({id: uid('q'), text: x.text, opts: x.opts, ans: x.ans}));
    E.qs = blank ? add : E.qs.concat(add);
    const nk = add.filter(x => x.ans < 0).length;
    closeModal(); render(true);
    toast(`${add.length} soal diimpor` + (nk ? `, ${nk} belum ada kunci` : '') + (r.skipped ? `, ${r.skipped} dilewati` : ''));
  },
  startnow() { S.edit.startAt = toLocal(now()); render(true); },
  addq() { S.edit.qs.push(blankQ(S.edit.optCount)); render(true); setTimeout(() => window.scrollTo(0, document.body.scrollHeight), 30); },
  async delq(t) { if (await ask('Hapus soal?', 'Soal ini akan dihapus dari daftar.', 'Hapus', true)) S.edit.qs.splice(+t.dataset.i, 1); closeModal(); render(true); },
  applyopt() { const n = S.edit.optCount; S.edit.qs.forEach(q => { while (q.opts.length < n) q.opts.push(''); q.opts.length = n; if (q.ans >= n) q.ans = -1; }); render(true); toast('Jumlah pilihan diterapkan'); },
  editkeys() { openModal(keysHtml(S.edit.title, S.edit.qs)); },
  keys(t) { const s = snapshot(S.exams[t.dataset.id]); openModal(keysHtml(S.exams[t.dataset.id].title, s.qs)); },
  saveexam: saveExam,
  toggle(t) { if (db) db.ref('exams/' + t.dataset.id + '/active').set(t.checked); S.exams[t.dataset.id].active = t.checked; ls.set('c_exams', S.exams); render(true); },
  dup(t) {
    const e = JSON.parse(JSON.stringify(S.exams[t.dataset.id])), id = uid('e'); const qs = {};
    Object.values(e.questions || {}).forEach(q => qs[uid('q')] = q);
    e.questions = qs; e.title += ' (Salinan)'; e.createdAt = Date.now(); e.active = false; e.startAt = 0;
    if (db) db.ref('exams/' + id).set(e); S.exams[id] = e; render(true); toast('Ujian diduplikasi (nonaktif)');
  },
  async delexam(t) { if (await ask('Hapus ujian?', `“${esc(S.exams[t.dataset.id].title)}” beserta seluruh soalnya akan dihapus permanen.`, 'Hapus', true)) { if (db) db.ref('exams/' + t.dataset.id).remove(); delete S.exams[t.dataset.id]; ls.set('c_exams', S.exams); toast('Ujian dihapus'); } closeModal(); render(true); },
  async delsub(t) { if (await ask('Hapus hasil?', 'Data hasil ini akan dihapus permanen.', 'Hapus', true)) { if (db) db.ref('submissions/' + t.dataset.id).remove(); delete S.subs[t.dataset.id]; } closeModal(); render(true); },
  async delsel(t) {
    const k = t.dataset.k, ids = Object.keys(S.sel[k]).filter(i => S.sel[k][i]); if (!ids.length) return;
    if (await ask(`Hapus ${ids.length} data?`, 'Data yang dipilih akan dihapus permanen.', 'Hapus', true)) {
      const u = {}; ids.forEach(i => u[i] = null);
      if (db) db.ref(k === 'results' ? 'submissions' : 'students').update(u);
      ids.forEach(i => { if (k === 'results') delete S.subs[i]; else delete S.students[i]; });
      if (k === 'students') ls.set('c_students', S.students);
      S.sel[k] = {}; toast('Data dihapus');
    }
    closeModal(); render(true);
  },
  csv() {
    const rows = resRows().sort((a, b) => a.submittedAt - b.submittedAt);
    const out = [['Nama', 'Jenis', 'Kelas / Asal Sekolah', 'NIS', 'Tanggal Lahir', 'Ujian', 'Benar', 'Total', 'Nilai', 'Waktu Kirim'].map(qv).join(',')]
      .concat(rows.map(r => [r.name, r.tipe === 'masuk' ? 'Tes Masuk' : 'Ujian Siswa', r.tipe === 'masuk' ? r.asalSekolah : r.kelas, r.nis, r.tipe === 'masuk' ? fdob(r.tglLahir) : '', r.examTitle, r.correct, r.total, r.score, fdate(r.submittedAt)].map(qv).join(',')));
    dl('hasil-ujian.csv', out.join('\n'));
  },
  /* PDF */
  pdfhasil() {
    const l = pdfSort(resRows()); if (!l.length) return toast('Tidak ada data untuk dicetak');
    const sc = l.map(r => r.score), avg = (sc.reduce((a, b) => a + b, 0) / sc.length).toFixed(1);
    const rows = l.map((r, i) => `<tr><td class="c">${i + 1}</td><td><b>${esc(r.name)}</b></td><td>${esc(pdfCls(r))}</td><td>${r.tipe === 'masuk' ? fdob(r.tglLahir) : esc(r.nis || '-')}</td>${S.filter ? '' : `<td>${esc(r.examTitle)}</td>`}<td class="c">${r.correct}</td><td class="c">${r.total - r.correct}</td><td class="c"><b>${r.score}</b></td><td>${fdate(r.submittedAt)}</td></tr>`).join('');
    pdfDoc('Rekap Hasil Ujian', `${pdfHead('Rekap Hasil Ujian', pdfInfo(l))}
    <div class="meta"><div>Peserta<b>${l.length}</b></div><div>Rata-rata<b>${avg}</b></div><div>Tertinggi<b>${Math.max(...sc)}</b></div><div>Terendah<b>${Math.min(...sc)}</b></div></div>
    <table><thead><tr><th class="c">No</th><th>Nama</th><th>Kelas / Asal Sekolah</th><th>NIS / Tgl Lahir</th>${S.filter ? '' : '<th>Ujian</th>'}<th class="c">Benar</th><th class="c">Salah</th><th class="c">Nilai</th><th>Waktu Kirim</th></tr></thead><tbody>${rows}</tbody></table>${pdfTtd()}`, false);
  },
  pdfjawab() {
    if (!S.filter) return toast('Pilih judul ujian dulu di filter');
    const e = S.exams[S.filter]; if (!e) return toast('Data soal ujian tidak ditemukan');
    const qs = snapshot(e).qs, l = pdfSort(resRows()); if (!l.length) return toast('Tidak ada data untuk dicetak');
    const dense = qs.length > 25 ? ' dense' : '';
    const rows = l.map((r, i) => `<tr><td class="c">${i + 1}</td><td><b>${esc(r.name)}</b></td><td>${esc(pdfCls(r))}</td>${qs.map(q => { const a = (r.answers || {})[q.id]; return a === undefined ? '<td class="c">–</td>' : `<td class="c ${a === q.ans ? 'o' : 'x'}">${LT[a]}</td>`; }).join('')}<td class="c">${r.correct}</td><td class="c"><b>${r.score}</b></td></tr>`).join('');
    const pct = qs.map(q => Math.round(l.filter(r => (r.answers || {})[q.id] === q.ans).length / l.length * 100) + '%');
    pdfDoc('Hasil Jawaban Siswa', `${pdfHead('Hasil Jawaban Siswa', pdfInfo(l))}
    <table class="${dense}"><thead><tr><th class="c">No</th><th>Nama</th><th>Kelas</th>${qs.map((q, i) => `<th class="c">${i + 1}</th>`).join('')}<th class="c">Benar</th><th class="c">Nilai</th></tr></thead><tbody>
    <tr class="kunci"><td colspan="3">Kunci Jawaban</td>${qs.map(q => `<td class="c">${LT[q.ans]}</td>`).join('')}<td></td><td></td></tr>${rows}
    <tr class="pct"><td colspan="3">% siswa menjawab benar</td>${pct.map(x => `<td class="c">${x}</td>`).join('')}<td></td><td></td></tr></tbody></table>
    <div class="note">Huruf hijau = jawaban benar, merah = salah, tanda – = tidak dijawab.</div>${pdfTtd()}`, true);
  },
  /* data siswa */
  addstu() { stuForm(null); },
  editstu(t) { stuForm(t.dataset.id); },
  savestu(t) {
    const name = $('#s_name').value.trim(), kelas = $('#s_kelas').value.trim(), nis = $('#s_nis').value.trim();
    if (!name || !kelas) return toast('Nama dan kelas wajib diisi');
    const id = t.dataset.id || uid('m'), old = S.students[id] || {}, o = {...old, name, kelas, nis, createdAt: old.createdAt || Date.now()};
    if (db) db.ref('students/' + id).set(o).catch(err => toast('Gagal menyimpan: ' + err.message));
    S.students[id] = o; ls.set('c_students', S.students); closeModal(); toast('Data siswa disimpan'); render(true);
  },
  async delstu(t) {
    const s = S.students[t.dataset.id] || {};
    if (await ask('Hapus siswa?', `<b>${esc(s.name)}</b> akan dihapus dari Data Siswa.`, 'Hapus', true)) { if (db) db.ref('students/' + t.dataset.id).remove(); delete S.students[t.dataset.id]; ls.set('c_students', S.students); toast('Siswa dihapus'); }
    closeModal(); render(true);
  },
  impstu() {
    openModal(`<h3>Impor Data Siswa</h3><p>Satu siswa per baris: <b>Nama; Kelas; NIS</b>. Pemisah boleh titik koma, tab, atau koma. Siswa dengan nama dan kelas yang sama dilewati.</p>
    <textarea id="imp_txt" class="inp" style="min-height:150px" placeholder="Ahmad Fauzi; XII IPA 1; 2023001&#10;Siti Aisyah; XII IPA 1; 2023002"></textarea>
    <label class="fld" style="margin-top:10px"><span>Atau pilih berkas CSV / TXT</span><input type="file" id="imp_file" accept=".csv,.txt,text/csv,text/plain" class="inp"></label>
    <div class="row end"><button class="btn" data-act="closem">Batal</button><button class="btn pri" data-act="doimp">Impor</button></div>`);
  },
  doimp() {
    const list = parseStudents($('#imp_txt').value); if (!list.length) return toast('Tidak ada baris yang valid (minimal Nama dan Kelas)');
    const have = new Set(Object.values(S.students).map(s => (s.name + '|' + s.kelas).toLowerCase())), u = {}; let skip = 0;
    list.forEach(s => {
      const k = (s.name + '|' + s.kelas).toLowerCase();
      if (have.has(k)) { skip++; return; }
      have.add(k); u[uid('m')] = {...s, createdAt: Date.now()};
    });
    const n = Object.keys(u).length; if (!n) return toast('Semua baris sudah ada di Data Siswa');
    if (db) db.ref('students').update(u).catch(err => toast('Gagal impor: ' + err.message));
    Object.assign(S.students, u); ls.set('c_students', S.students); closeModal(); render(true);
    toast(`${n} siswa diimpor` + (skip ? `, ${skip} dilewati` : ''));
  },
  csvstu() {
    const out = [['Nama', 'Kelas', 'NIS'].map(qv).join(',')].concat(stuRows().map(s => [s.name, s.kelas, s.nis].map(qv).join(',')));
    dl('data-siswa.csv', out.join('\n'));
  },
  async chpw() {
    const o = $('#pw0').value, n = $('#pw1').value;
    if ((await sha(o)) !== S.cfg.adminHash) return toast('Password lama salah');
    if (n.length < 4) return toast('Password baru minimal 4 karakter');
    if (!db || !S.online) return toast('Perlu internet untuk mengganti password');
    await db.ref('config/adminHash').set(await sha(n)); toast('Password diganti'); $('#pw0').value = $('#pw1').value = '';
  },
  async clearlive() {
    const ids = Object.entries(S.live || {}).filter(([i, r]) => r.status === 'selesai').map(x => x[0]);
    if (!ids.length) return toast('Tidak ada catatan yang selesai');
    if (await ask('Hapus catatan selesai?', `${ids.length} catatan pemantauan siswa yang sudah selesai akan dihapus. Hasil ujian tidak terpengaruh.`, 'Hapus', true)) {
      const u = {}; ids.forEach(i => u[i] = null);
      if (db) db.ref('live').update(u); ids.forEach(i => delete S.live[i]); toast('Catatan dihapus');
    }
    closeModal(); render(true);
  },
  async dellive(t) {
    if (await ask('Hapus catatan ini?', 'Jika siswa masih mengerjakan, catatan akan muncul lagi otomatis. Hasil ujian tidak terpengaruh.', 'Hapus', true)) { if (db) db.ref('live/' + t.dataset.id).remove(); delete S.live[t.dataset.id]; }
    closeModal(); render(true);
  },
  saverules() { const v = $('#rules_txt').value.trim(); setCfg('rules', v); toast(v ? 'Tata tertib disimpan' : 'Memakai tata tertib bawaan'); render(true); },
  resetrules() { setCfg('rules', ''); toast('Dikembalikan ke tata tertib bawaan'); render(true); },
  sync() { syncPending(); toast('Mencoba mengirim ulang…'); }
};
document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]'); if (!t || t.tagName === 'SELECT' || t.type === 'checkbox') return;
  const f = A[t.dataset.act]; if (f) f(t, e);
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset.act === 'search') {
    S.q[t.dataset.k] = t.value; S.pg[t.dataset.k] = 1;
    const pos = t.selectionStart; render(true);
    const n = $('#qs'); if (n) { n.focus(); try { n.setSelectionRange(pos, pos); } catch (x) {} }
    return;
  }
  const E = S.edit; if (!E) return;
  if (t.dataset.e && (t.type === 'text' || t.type === 'number' || t.tagName === 'TEXTAREA')) E[t.dataset.e] = t.type === 'number' ? +t.value : t.value;
  else if (t.dataset.q !== undefined) { const q = E.qs[+t.dataset.q]; if (t.dataset.f === 'text') q.text = t.value; else if (t.dataset.f === 'opt') q.opts[+t.dataset.k] = t.value; }
});
document.addEventListener('change', e => {
  const t = e.target, E = S.edit, act = t.dataset.act;
  if (t.id === 'impq_file') { const f = t.files[0]; if (f) { const r = new FileReader(); r.onload = () => { $('#impq_txt').value = r.result; }; r.readAsText(f); } return; }
  if (t.id === 'imp_file') { const f = t.files[0]; if (f) { const r = new FileReader(); r.onload = () => { $('#imp_txt').value = r.result; }; r.readAsText(f); } return; }
  if (act === 'agree') { const b = $('#btnBegin'); if (b) b.disabled = !t.checked; return; }
  if (act === 'toggle') return A.toggle(t);
  if (act === 'rkls') { S.rkls = t.value; S.pg.results = 1; return render(true); }
  if (act === 'filter') { S.filter = t.value; S.pg.results = 1; return render(true); }
  if (act === 'defopt') { setCfg('defaultOpt', +t.value); return toast('Default disimpan'); }
  if (act === 'cfgsiswa') { setCfg('siswaOn', t.checked); toast(t.checked ? 'Menu Ujian Siswa diaktifkan' : 'Menu Ujian Siswa dinonaktifkan'); return render(true); }
  if (act === 'lfilter') { S.lfilter = t.value; return render(true); }
  if (act === 'cfgpmb') { setCfg('pmbOn', t.checked); toast(t.checked ? 'Fitur Tes Masuk diaktifkan' : 'Fitur Tes Masuk dinonaktifkan'); return render(true); }
  if (act === 'cfgroster') { setCfg('useRoster', t.checked); toast(t.checked ? 'Identitas dipilih dari Data Siswa' : 'Identitas diisi manual'); return render(true); }
  if (act === 'fkelas') { $('#f_sid').innerHTML = sidOptions(t.value, ''); $('#f_nis').value = ''; return; }
  if (act === 'fsid') { const s = S.students[t.value]; $('#f_nis').value = s ? (s.nis || '') : ''; return; }
  if (act === 'selrow') { S.sel[t.dataset.k][t.dataset.id] = t.checked; return render(true); }
  if (act === 'selall') { const k = t.dataset.k, l = k === 'results' ? resRows() : stuRows(); l.forEach(r => S.sel[k][r.id] = t.checked); return render(true); }
  if (!E) return;
  if (t.dataset.e === 'showResult' || t.dataset.e === 'active') E[t.dataset.e] = t.checked;
  else if (t.dataset.e === 'optCount') E.optCount = +t.value;
  else if (t.dataset.e === 'startAt') E.startAt = t.value;
  else if (t.dataset.e === 'tipe') { E.tipe = t.value; render(true); }
  else if (t.dataset.q !== undefined) {
    const i = +t.dataset.q, q = E.qs[i];
    if (t.dataset.f === 'ans') { q.ans = +t.value; const kb = $('#kb' + i); kb.textContent = 'Kunci: ' + LT[q.ans]; kb.classList.remove('none'); }
    else if (t.dataset.f === 'n') { const n = +t.value; while (q.opts.length < n) q.opts.push(''); q.opts.length = n; if (q.ans >= n) q.ans = -1; render(true); }
  }
});
document.addEventListener('keydown', e => { if (e.key === 'Enter' && $('#ap') && e.target.id && e.target.id.startsWith('ap')) A.adminok(); });

setInterval(() => {
  if (S.view !== 'home') return;
  const sig = visibleExams().map(e => e.id + examState(e).k).join();
  if (sig !== homeSig) { homeSig = sig; return render(true); }
  document.querySelectorAll('[data-cd]').forEach(el => { const e = S.exams[el.dataset.cd]; if (!e) return; const st = examState(e); if (st.k === 'wait') el.textContent = fmt(st.left / 1000); });
}, 1000);
setInterval(() => { if (navigator.onLine !== false && ls.get('pending', []).length) syncPending(); }, 15000);
setInterval(() => { if (S.view === 'admin' && S.tab === 'live' && !S.edit) paintLive(); }, 5000);
function tick() {
  const d = new Date(now()), el = $('#clock'); if (!el) return;
  el.children[0].textContent = d.toLocaleTimeString('id-ID', {hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false}).replace(/\./g, ':');
  el.children[1].textContent = d.toLocaleDateString('id-ID', {weekday: 'long', day: 'numeric', month: 'long', year: 'numeric'});
  el.children[2].textContent = d.toLocaleDateString('id-ID', {weekday: 'short', day: 'numeric', month: 'short'});
}
setInterval(tick, 1000); tick();
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});
if (S.admin) listenSubs();
if (S.admin) S.view = 'admin';
render(); paintStatus();
</script>
</body>
